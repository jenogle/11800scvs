<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>電腦軟體應用乙級｜學生作答</title><link rel="stylesheet" href="/assets/app.css"></head><body>
<header><div class="wrap"><h1>電腦軟體應用乙級｜學生作答</h1><div id="headInfo" class="sub">載入考試中…</div></div></header>
<main class="main">
<section id="home" class="card">
<h2 id="examTitle">目前考試</h2><div id="statusBox" class="msg info">正在讀取老師發布的考試…</div>
<div id="rules" class="msg warn hidden"></div>
<div id="gateBox" class="msg warn hidden"></div>
<div id="loginBox" class="hidden" style="margin-top:16px">
 <div class="grid2"><div class="field"><label>學號</label><input id="sid" placeholder="請輸入學號" autocomplete="off"></div><div class="field"><label>姓名</label><input id="sname" placeholder="請輸入姓名" autocomplete="off"></div></div>
 <div id="gatePasswordWrap" class="field hidden" style="margin-top:12px"><label>考場密碼</label><input id="gatePassword" type="password" placeholder="請輸入老師提供的考場密碼"><small>只有指定時段內需要輸入。</small></div>
 <div class="toolbar"><button class="primary" id="startBtn">我已了解規則，開始考試</button></div>
</div>
</section>

<section id="exam" class="hidden">
<div class="stats">
 <div class="stat"><span class="sub">總題數</span><b id="total">0</b></div>
 <div class="stat"><span class="sub">已作答</span><b id="done">0</b></div>
 <div class="stat"><span class="sub">未作答</span><b id="left">0</b></div>
 <div class="stat"><span class="sub">目前題號</span><b id="now">0 / 0</b></div>
</div>
<div id="antiNotice" class="msg warn hidden"></div>
<div class="card"><div class="progress"><div id="bar"></div></div><div id="nav" class="nav"></div></div>
<div id="qbox" class="card"></div>
<div class="card"><div class="toolbar" style="justify-content:space-between"><div class="toolbar"><button class="ghost" id="prevBtn">上一題</button><button class="secondary" id="nextBtn">下一題</button></div><button class="primary" id="submitBtn">交卷</button></div></div>
</section>

<section id="result" class="hidden">
  <div class="card">
    <h2>作答完成</h2>
    <div style="font-size:46px;font-weight:900;color:#1d4ed8"><span id="score">0</span> / <span id="full">0</span></div>
    <p id="resultMeta"></p>
    <div id="resultReason" class="msg info">成績已送回老師端。</div>
  </div>
  <div class="card">
    <h2>本次作答檢討</h2>
    <div class="sub" style="margin-top:6px">以下僅顯示你這一次考卷的題目、你的答案與正確答案。</div>
    <div id="reviewBox" style="margin-top:16px">正在載入檢討內容…</div>
  </div>
</section>
</main>

<div id="leaveOverlay" class="overlay hidden"><div class="overlaybox"><h2>你已離開考試頁面</h2><p>請立即回到考試視窗，否則將自動交卷。</p><div id="countdown" class="countdown">5</div><p class="sub">回到此頁後倒數會自動取消。</p></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/student-app.js"></script></body></html>
