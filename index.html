<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>電腦軟體應用乙級｜學生作答</title><style>body{font-family:sans-serif;background:#f5f7fb;color:#172033;margin:0}main{max-width:900px;margin:24px auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin-bottom:14px}input,button{font:inherit;padding:10px;border-radius:8px}input{border:1px solid #bbb}.p{background:#2563eb;color:#fff;border:0}.hidden{display:none}.opt{display:block;border:1px solid #ddd;border-radius:8px;padding:10px;margin:8px 0}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav button{width:38px;height:34px;border:0}.done{background:#dbeafe}.cur{outline:2px solid #2563eb}</style></head><body><main><section id="home" class="card"><h1>電腦軟體應用乙級｜學生作答</h1><p id="st">讀取考試中…</p><div id="login" class="hidden"><input id="sid" placeholder="學號"> <input id="name" placeholder="姓名"> <button class="p" id="start">開始考試</button></div></section><section id="exam" class="hidden"><div class="card"><div id="meta"></div><div id="nav" class="nav"></div></div><div id="q" class="card"></div><div class="card"><button id="prev">上一題</button> <button id="next">下一題</button> <button class="p" id="submit">交卷</button></div></section><section id="result" class="card hidden"><h2>作答完成</h2><h1 id="score"></h1><p>成績已送回老師端。</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://juspbhysjkqwzfccrnhb.supabase.co','sb_publishable_SlN9cUzDYke3Mh2cmaBJxA_wnX5Pv7R');let ex,aid,qs=[],ans={},i=0;const $=x=>document.getElementById(x),only=x=>['home','exam','result'].forEach(y=>$(y).classList.toggle('hidden',y!==x));async function load(){const{data,error}=await db.rpc('software_exam_get_active');if(error)return $('st').textContent=error.message;if(!data)return $('st').textContent='目前沒有開放中的考試';ex=data;$('st').textContent=data.title+'｜共 '+data.question_count+' 題';$('login').classList.remove('hidden')}async function start(){let sid=$('sid').value.trim(),name=$('name').value.trim();if(!sid||!name)return alert('請輸入學號與姓名');const{data,error}=await db.rpc('software_exam_begin_attempt',{p_exam_id:ex.id,p_student_id:sid,p_student_name:name});if(error)return alert(error.message);aid=data.attempt_id;qs=data.questions;i=0;ans={};only('exam');nav();render()}function nav(){$('nav').innerHTML=qs.map((q,n)=>'<button id="n'+n+'" onclick="go('+n+')">'+(n+1)+'</button>').join('')}window.go=n=>{i=n;render()};window.pick=(id,v,ch,k)=>{if(k==='single')ans[id]=ch?[v]:[];else{let s=new Set(ans[id]||[]);ch?s.add(v):s.delete(v);ans[id]=[...s].sort((a,b)=>a-b)}meta()};function render(){let q=qs[i],sel=ans[q.id]||[],t=q.kind==='multiple'?'checkbox':'radio';$('q').innerHTML='<h3>'+(i+1)+'. '+q.prompt+'（'+(q.kind==='multiple'?'複選':'單選')+'）</h3>'+q.options.map((o,n)=>'<label class="opt"><input type="'+t+'" name="q'+q.id+'" '+(sel.includes(n+1)?'checked':'')+' onchange="pick(\''+q.id+'\','+(n+1)+',this.checked,\''+q.kind+'\')"> '+String.fromCharCode(65+n)+'. '+o+'</label>').join('');document.querySelectorAll('#nav button').forEach((b,n)=>b.classList.toggle('cur',n===i));meta()}function meta(){let d=qs.filter(q=>(ans[q.id]||[]).length).length;$('meta').textContent='已作答 '+d+' / '+qs.length;qs.forEach((q,n)=>$('n'+n)?.classList.toggle('done',(ans[q.id]||[]).length>0))}async function submit(){let u=qs.filter(q=>(ans[q.id]||[]).length===0).length;if(u&&!confirm('還有 '+u+' 題未作答，確定交卷？'))return;const{data,error}=await db.rpc('software_exam_submit_attempt',{p_attempt_id:aid,p_answers:ans});if(error)return alert(error.message);$('score').textContent=data.score+' / '+data.total;only('result')}$('start').onclick=start;$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(i<qs.length-1){i++;render()}};$('submit').onclick=submit;load();</script></body></html>
