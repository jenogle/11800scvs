name: Build 116 question figures

on:
  push:
    paths:
      - 'scripts/review_116_figures.py'
      - 'data/116-figure-source-manifest.json'
      - '.github/workflows/build-116-figures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF processor
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.5
      - name: Extract source-verified clips
        run: python scripts/review_116_figures.py
      - name: Commit originals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add question-figures/116/
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Add 26 source-verified original question figures"
            git push origin HEAD:main
          fi
