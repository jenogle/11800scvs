<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>電腦軟體應用乙級｜老師出題</title><style>body{font-family:sans-serif;background:#f5f7fb;color:#172033;margin:0}main{max-width:980px;margin:24px auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}input,select,button{font:inherit;padding:10px;border-radius:8px}input,select{border:1px solid #bbb}.p{background:#2563eb;color:#fff;border:0}.d{background:#fee2e2;color:#991b1b;border:0}.checks{display:flex;gap:10px;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="card"><h1>老師出題</h1><div class="grid"><input id="pw" placeholder="老師管理碼"><input id="title" value="電腦軟體應用乙級學科測驗"><input id="count" type="number" value="80" min="1"><select id="type"><option value="mixed">單選＋複選混合</option><option value="single">只考單選</option><option value="multiple">只考複選</option></select><select id="draw"><option value="random">全範圍隨機</option><option value="balanced">各範圍平均混抽</option></select><select id="open"><option value="true">發布後立即開放</option><option value="false">只建立</option></select></div><h3>考試範圍</h3><div id="subs" class="checks"><label><input type="checkbox" value="11800-01" checked>電腦概論</label><label><input type="checkbox" value="11800-02" checked>應用軟體使用</label><label><input type="checkbox" value="11800-03" checked>系統軟體使用</label><label><input type="checkbox" value="11800-04" checked>資訊安全</label><label><input type="checkbox" value="90011-01">90011 電腦硬體架構</label><label><input type="checkbox" value="90011-02">90011 網路概論與應用</label><label><input type="checkbox" value="90011-03">90011 作業系統</label><label><input type="checkbox" value="90011-04">90011 資訊運算思維</label><label><input type="checkbox" value="90011-05">90011 資訊安全</label><label><input type="checkbox" value="90006-01">職業安全衛生</label><label><input type="checkbox" value="90007-01">工作倫理與職業道德</label><label><input type="checkbox" value="90008-03">環境保護</label><label><input type="checkbox" value="90009-04">節能減碳</label></div><p><button class="p" id="pub">發布考試</button> <button class="d" id="close">關閉考試</button> <button id="refresh">重新整理成績</button></p><div id="msg"></div></section><section class="card"><h2>目前開放考試</h2><div id="active"></div></section><section class="card"><h2>學生成績</h2><div style="overflow:auto"><table><thead><tr><th>開始</th><th>交卷</th><th>考試</th><th>學號</th><th>姓名</th><th>分數</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://juspbhysjkqwzfccrnhb.supabase.co','sb_publishable_SlN9cUzDYke3Mh2cmaBJxA_wnX5Pv7R'),$=x=>document.getElementById(x);function token(){return $('pw').value.trim()}async function active(){const{data,error}=await db.rpc('software_exam_get_active');$('active').textContent=error?'讀取失敗：'+error.message:(data?data.title+'｜'+data.question_count+' 題｜已開放':'目前沒有開放中的考試')}async function pub(){let s=[...document.querySelectorAll('#subs input:checked')].map(x=>x.value);if(!token())return alert('請輸入老師管理碼');const{data,error}=await db.rpc('software_exam_teacher_publish',{p_token:token(),p_title:$('title').value,p_question_count:+$('count').value,p_type_mode:$('type').value,p_subjects:s,p_draw_mode:$('draw').value,p_open:$('open').value==='true'});$('msg').textContent=error?'發布失敗：'+error.message:'發布完成，可用題數 '+data.available;active();records()}async function closeExam(){if(!token())return alert('請輸入老師管理碼');const{error}=await db.rpc('software_exam_teacher_close',{p_token:token()});$('msg').textContent=error?'關閉失敗：'+error.message:'已關閉';active()}async function records(){if(!token())return;$('rows').innerHTML='<tr><td colspan="6">讀取中…</td></tr>';const{data,error}=await db.rpc('software_exam_teacher_records',{p_token:token()});if(error)return $('rows').innerHTML='<tr><td colspan="6">'+error.message+'</td></tr>';$('rows').innerHTML=(data||[]).map(r=>'<tr><td>'+new Date(r.started_at).toLocaleString('zh-TW')+'</td><td>'+(r.submitted_at?new Date(r.submitted_at).toLocaleString('zh-TW'):'未交卷')+'</td><td>'+r.exam_title+'</td><td>'+r.student_id+'</td><td>'+r.student_name+'</td><td>'+(r.score==null?'—':r.score+' / '+r.total)+'</td></tr>').join('')||'<tr><td colspan="6">目前沒有紀錄</td></tr>'}$('pub').onclick=pub;$('close').onclick=closeExam;$('refresh').onclick=records;active();</script></body></html>
